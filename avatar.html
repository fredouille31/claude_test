<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Avatar Renaissance</title>
    <style>
      body {
        font-family: Arial;
        background: #222;
        color: #fff;
        text-align: center;
      }
      .avatar {
        position: relative;
        width: 400px;
        height: 600px;
        margin: 15px auto;
      }
      .avatar img,
      .avatar canvas {
        position: absolute;
        inset: 0;
        width: 400px;
        height: 600px;
      }
      #yeux,
      #iris {
        transform: translateY(9px);
      }
      #nez {
        transform: translateY(5px);
      }
      #bouche {
        transform: translate(3px, 5px);
      }
      #base {
        z-index: 1;
      }
      #buste {
        z-index: 2;
      }
      #nez {
        z-index: 3;
      }
      #bouche {
        z-index: 4;
      }
      #sourcils {
        z-index: 5;
      }
      #marques {
        z-index: 6;
      }
      #yeux {
        z-index: 7;
      }
      #iris {
        z-index: 8;
      }
      #pilosite {
        z-index: 9;
      }
      #cheveux {
        z-index: 10;
      }
      #lisere {
        z-index: 11;
      }
      #chapeau {
        z-index: 12;
      }
      .options {
        max-width: 760px;
        margin: 18px auto 35px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        text-align: left;
        padding: 0 12px;
        box-sizing: border-box;
      }
      .champ {
        display: flex;
        flex-direction: column;
        gap: 6px;
        background: #303030;
        padding: 12px;
        border-radius: 8px;
      }
      .champ span {
        font-weight: 600;
        font-size: 14px;
      }
      .champ select {
        width: 100%;
        box-sizing: border-box;
        background: #181818;
        color: #fff;
        border: 1px solid #777;
        border-radius: 6px;
        padding: 10px;
        font-size: 15px;
        cursor: pointer;
      }
      .champ select:focus {
        outline: 2px solid #d9ae69;
        outline-offset: 2px;
      }
      @media (max-width: 580px) {
        .options {
          grid-template-columns: 1fr;
        }
        .avatar {
          transform: scale(min(1, calc((100vw - 20px) / 400)));
          transform-origin: top center;
          margin-bottom: 0;
        }
      }
    </style>
  </head>
  <body>
    <h2>Avatar homme</h2>

    <!-- Les calques sont remplis par dessiner() à partir de l'état de l'avatar -->
    <div class="avatar">
      <img id="base" src="images/base/base_homme.png" alt="" />
      <img id="buste" alt="" />
      <img id="nez" alt="" />
      <img id="bouche" src="images/bouche/bouche.png" alt="" />
      <img id="yeux" alt="" />
      <canvas id="iris" width="400" height="600"></canvas>
      <img id="marques" alt="" />
      <img id="sourcils" alt="" />
      <img id="pilosite" alt="" />
      <img id="cheveux" alt="" />
      <img id="lisere" alt="" />
      <img id="chapeau" alt="" />
    </div>

    <!-- Les menus sont générés à partir de la liste "menus" -->
    <div class="options" id="options"></div>

    <script>
      /* ===== Palettes de couleurs ===== */

      /* Base et nez reçoivent EXACTEMENT le même filtre de peau */
      const peaux = {
        ivoire: { nom: "1 · Ivoire", valeur: "sepia(.36) saturate(1.16) hue-rotate(337deg) brightness(1.12)" },
        pale: { nom: "2 · Pâle chaud", valeur: "sepia(.42) saturate(1.22) hue-rotate(336deg) brightness(1.07)" },
        rose: { nom: "3 · Clair rosé", valeur: "sepia(.43) saturate(1.42) hue-rotate(320deg) brightness(1.03)" },
        claire: { nom: "4 · Clair", valeur: "sepia(.50) saturate(1.34) hue-rotate(335deg) brightness(.98)" },
        mediterraneen: { nom: "5 · Méditerranéen", valeur: "sepia(.60) saturate(1.42) hue-rotate(338deg) brightness(.87)" },
        mate: { nom: "6 · Mat", valeur: "sepia(.67) saturate(1.48) hue-rotate(337deg) brightness(.76)" },
        brun: { nom: "7 · Brun", valeur: "sepia(.72) saturate(1.42) hue-rotate(334deg) brightness(.62)" },
        foncee: { nom: "8 · Foncé", valeur: "sepia(.75) saturate(1.36) hue-rotate(330deg) brightness(.49)" },
      };

      /* Appliquée aux cheveux, à la barbe, aux sourcils et au liseré */
      const couleursCheveux = {
        gris: { nom: "Gris (original)", valeur: "none" },
        blond: { nom: "Blond", valeur: "sepia(.85) saturate(1.75) hue-rotate(350deg) brightness(1.18)" },
        chatain: { nom: "Châtain", valeur: "sepia(.75) saturate(1.75) hue-rotate(342deg) brightness(.82)" },
        brun: { nom: "Brun", valeur: "sepia(.60) saturate(1.45) hue-rotate(338deg) brightness(.60)" },
        roux: { nom: "Roux", valeur: "sepia(.82) saturate(1.90) hue-rotate(326deg) brightness(.86)" },
        noir: { nom: "Noir", valeur: "sepia(.10) saturate(.55) brightness(.46)" },
      };

      const couleursIris = {
        bleu: { nom: "Bleu", valeur: "#3075b9" },
        bleuClair: { nom: "Bleu clair", valeur: "#80c8e9" },
        vert: { nom: "Vert", valeur: "#39864a" },
        vertClair: { nom: "Vert clair", valeur: "#9cbb5a" },
        ambre: { nom: "Jaune / ambre", valeur: "#d8ae2c" },
        marron: { nom: "Marron", valeur: "#6c3e26" },
        noisette: { nom: "Noisette", valeur: "#a2783b" },
        gris: { nom: "Gris", valeur: "#92999d" },
        violet: { nom: "Violet", valeur: "#8553a6" },
        rouge: { nom: "Rouge", valeur: "#b43e3e" },
      };

      /* ===== Liste des menus =====
         Pour ajouter un élément (ex. un 9e nez) : déposer images/nez/nez9.png
         puis passer "nombre" de 8 à 9.
         - image   : chemin du fichier sans le numéro (images/<image><n>.png)
         - nombre  : nombre de fichiers ; premier : numéro du premier (1 par défaut)
         - aucun   : texte de l'option "rien" (valeur null)
         - couleurs: palette à utiliser à la place des images
         - defaut  : valeur au chargement de la page */
      const menus = [
        { cle: "buste", titre: "Buste", nom: "Buste", image: "base/buste", nombre: 1, aucun: "Sans buste", defaut: 1 },
        { cle: "nez", titre: "Nez", nom: "Nez", image: "nez/nez", nombre: 8, defaut: 1 },
        { cle: "regard", titre: "Forme du regard", nom: "Regard", image: "yeux/yeux", nombre: 7, defaut: 1 },
        { cle: "iris", titre: "Couleur des yeux", couleurs: couleursIris, defaut: "gris" },
        { cle: "sourcils", titre: "Sourcils", nom: "Sourcils", image: "sourcils/sourcils", nombre: 6, defaut: 1 },
        { cle: "marques", titre: "Marques du visage", nom: "Marque", image: "marques/marques", nombre: 1, aucun: "Aucune", defaut: null },
        { cle: "pilosite", titre: "Pilosité", nom: "Pilosité", image: "pilosite/pilosite", nombre: 13, aucun: "Aucune", defaut: null },
        { cle: "coupe", titre: "Coupe", nom: "Coupe", image: "cheveux/coupe", premier: 0, nombre: 3, aucun: "Chauve", defaut: 1 },
        { cle: "cheveux", titre: "Couleur des cheveux, de la barbe et des sourcils", couleurs: couleursCheveux, defaut: "gris" },
        { cle: "peau", titre: "Peau (8 nuances progressives)", couleurs: peaux, defaut: "claire" },
        { cle: "chapeau", titre: "Chapeau", nom: "Chapeau", image: "chapeau/chapeau", nombre: 1, aucun: "Aucun", defaut: null },
      ];

      /* ===== État de l'avatar : un choix par menu ===== */
      const menuPar = Object.fromEntries(menus.map((m) => [m.cle, m]));
      const avatar = Object.fromEntries(menus.map((m) => [m.cle, m.defaut]));

      function fichier(cle) {
        const n = avatar[cle];
        return n === null ? null : `images/${menuPar[cle].image}${n}.png`;
      }

      /* Affiche un calque avec ce fichier, ou le masque si chemin est null */
      function calque(id, chemin) {
        const el = document.getElementById(id);
        el.style.display = chemin ? "block" : "none";
        if (chemin && el.getAttribute("src") !== chemin) el.src = chemin;
      }

      /* ===== Rendu : applique tout l'état aux calques ===== */
      function dessiner() {
        calque("buste", fichier("buste"));
        calque("nez", fichier("nez"));
        calque("yeux", fichier("regard"));
        calque("sourcils", fichier("sourcils"));
        calque("marques", fichier("marques"));
        calque("pilosite", fichier("pilosite"));

        /* Avec un chapeau, la coupe est remplacée par le liseré (sauf si chauve) */
        const avecChapeau = avatar.chapeau !== null;
        calque("cheveux", avecChapeau ? null : fichier("coupe"));
        calque("lisere", avecChapeau && avatar.coupe !== null ? "images/cheveux/lisere.png" : null);
        calque("chapeau", fichier("chapeau"));

        const peau = peaux[avatar.peau].valeur;
        for (const id of ["base", "nez"]) document.getElementById(id).style.filter = peau;

        const poils = couleursCheveux[avatar.cheveux].valeur;
        for (const id of ["cheveux", "pilosite", "sourcils", "lisere"]) document.getElementById(id).style.filter = poils;

        const cheminIris = `images/yeux/iris${avatar.regard}.png`;
        if (sourceIris.getAttribute("src") !== cheminIris) sourceIris.src = cheminIris;
        else colorierIris();
      }

      /* ===== Recoloration des seuls iris : les blancs des yeux restent intacts ===== */
      const canvas = document.getElementById("iris"),
        ctx = canvas.getContext("2d");
      const sourceIris = new Image();
      sourceIris.onload = colorierIris;

      function colorierIris() {
        if (!sourceIris.complete || !sourceIris.naturalWidth) return;
        const hex = couleursIris[avatar.iris].valeur;
        ctx.clearRect(0, 0, 400, 600);
        ctx.drawImage(sourceIris, 0, 0, 400, 600);
        const img = ctx.getImageData(0, 0, 400, 600),
          d = img.data;
        const rgb = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
        for (let i = 0; i < d.length; i += 4) {
          if (!d[i + 3]) continue;
          const gris = (d[i] + d[i + 1] + d[i + 2]) / 3;
          if (gris < 38) continue; // Pupille noire conservée
          const luminosite = gris / 145;
          for (let j = 0; j < 3; j++) d[i + j] = Math.min(255, rgb[j] * luminosite);
        }
        ctx.putImageData(img, 0, 0);
      }

      /* ===== Génération des menus ===== */
      const zoneOptions = document.getElementById("options");
      for (const m of menus) {
        const choix = [];
        if (m.couleurs) {
          for (const [cle, c] of Object.entries(m.couleurs)) choix.push([cle, c.nom]);
        } else {
          if (m.aucun) choix.push(["", m.aucun]);
          const premier = m.premier ?? 1;
          for (let n = premier; n < premier + m.nombre; n++) choix.push([String(n), `${m.nom} ${n}`]);
        }

        const select = document.createElement("select");
        for (const [valeur, texte] of choix) {
          const actif = valeur === String(m.defaut ?? "");
          select.add(new Option(texte, valeur, actif, actif));
        }
        select.onchange = () => {
          if (m.couleurs) avatar[m.cle] = select.value;
          else avatar[m.cle] = select.value === "" ? null : Number(select.value);
          dessiner();
        };

        const champ = document.createElement("label");
        champ.className = "champ";
        const titre = document.createElement("span");
        titre.textContent = m.titre;
        champ.append(titre, select);
        zoneOptions.append(champ);
      }

      dessiner();
    </script>
  </body>
</html>
